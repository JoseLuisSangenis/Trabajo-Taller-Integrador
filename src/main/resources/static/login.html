<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso al Sistema — Instituto Educativo</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .login-container {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(26,58,92,0.15);
      border: 1px solid rgba(26,58,92,0.1);
    }
    .login-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 2rem 1.5rem;
      border-radius: var(--radius) var(--radius) 0 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-universidad">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fa-solid fa-graduation-cap fs-4"></i>
        <span>Instituto Educativo</span>
      </a>
      <div class="ms-auto" id="navbar-user-info"></div>
    </div>
  </nav>

  <main class="login-container py-5">
    <div class="container d-flex justify-content-center">
      <div class="card login-card">
        <div class="login-header">
          <i class="fa-solid fa-user-lock fa-3x mb-2"></i>
          <h3 class="fw-bold mb-1">Iniciar Sesión</h3>
          <p class="small mb-0 opacity-75">Ingrese sus credenciales para acceder</p>
        </div>
        <div class="card-body p-4">
          <div id="login-alert"></div>

          <form id="form-login" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="username">
                <i class="bi bi-person me-1"></i>Usuario <span class="text-danger">*</span>
              </label>
              <input type="text" id="username" class="form-control" placeholder="Ej: admin o alumno1" required autocomplete="username" />
              <div class="invalid-feedback">Por favor ingrese su nombre de usuario.</div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold" for="password">
                <i class="bi bi-key me-1"></i>Contraseña <span class="text-danger">*</span>
              </label>
              <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
              <div class="invalid-feedback">Por favor ingrese su contraseña.</div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema
            </button>
          </form>

          <div class="mt-4 pt-3 border-top text-center text-muted small">
            <div><i class="bi bi-info-circle me-1"></i>Acceso para Administradores, Docentes y Alumnos</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <small>Instituto Educativo &mdash; Sistema de Gestión Universitaria</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Si ya está logueado, redirigir al index
    if (AuthAPI.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('login-alert');
      alertEl.innerHTML = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      let valid = true;
      if (!username) {
        document.getElementById('username').classList.add('is-invalid');
        valid = false;
      } else {
        document.getElementById('username').classList.remove('is-invalid');
      }

      if (!password) {
        document.getElementById('password').classList.add('is-invalid');
        valid = false;
      } else {
        document.getElementById('password').classList.remove('is-invalid');
      }

      if (!valid) return;

      setLoading(true);
      try {
        const user = await AuthAPI.login(username, password);
        showAlert(alertEl, `¡Bienvenido/a, ${user.username}!`, 'success');
        setTimeout(() => {
          if (user.rol === 'ALUMNO' && user.idAlumno) {
            window.location.href = 'mi-situacion/index.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 800);
      } catch (err) {
        showAlert(alertEl, err.message, 'danger');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
